[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "digisnap-mcp"
version = "0.7.0"
description = "MCP server for comparing products across Digikala and SnappShop."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0.0,<2.0.0", "PySocks>=1.7.1,<2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.12"]

[project.scripts]
digisnap-mcp = "digisnap_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/digisnap_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
