name: CI

on:
  push:
    branches: [main, phase-1-core, phase-5-shopping-intelligence, phase-6-production-hardening]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest --cov=digisnap_mcp --cov-report=term-missing
      - name: Compile
        run: python -m compileall -q src
      - name: Smoke import
        run: python -c "from digisnap_mcp.server import mcp; print(mcp.name)"
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install audit tool
        run: python -m pip install --upgrade pip pip-audit
      - name: Dependency audit
        run: pip-audit --strict
