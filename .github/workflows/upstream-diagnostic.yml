name: upstream-diagnostic
on:
  push:
    branches: [diagnostic-upstream-network]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe upstreams
        run: |
          set +e
          echo '=== DIGIKALA V3 ==='
          curl -sS -D /tmp/dk_headers -o /tmp/dk_body --max-time 20 'https://api.digikala.com/v3/search/?q=iPhone%2016'
          rc=$?
          echo "curl_rc=$rc"
          sed -n '1,40p' /tmp/dk_headers || true
          echo '--- body ---'
          head -c 500 /tmp/dk_body || true
          echo
          echo '=== SNAPP SHOP ==='
          curl -sS -D /tmp/ss_headers -o /tmp/ss_body --max-time 20 -X POST 'https://apix.snappshop.ir/search/v1?lat=35.77331&lng=51.418591' \\
            -H 'Accept: application/json, text/plain, */*' \\
            -H 'Content-Type: application/json' \\
            -H 'Origin: https://snappshop.ir' \\
            -H 'Referer: https://snappshop.ir/' \\
            -H 'User-Agent: Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/140.0.0.0 Mobile Safari/537.36' \\
            --data '{"query":"iPhone 16","render":4}'
          rc=$?
          echo "curl_rc=$rc"
          sed -n '1,60p' /tmp/ss_headers || true
          echo '--- body ---'
          head -c 500 /tmp/ss_body || true
          echo
